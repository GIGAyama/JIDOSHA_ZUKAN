<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>selftest</title>
  <style>
    #tap {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #fff;
      font: 13px/1.5 monospace;
      padding: 10px;
      overflow: auto;
      white-space: pre-wrap;
    }

    .ok {
      color: #157a3b;
    }

    .ng {
      color: #c0242c;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="tap">running…</div>
  <iframe id="fr" src="index.html" style="width:1100px;height:900px;border:0"></iframe>

  <script>
    /* =====================================================================
       selftest.html — じどう車ずかん を まとめて たしかめる

       ひらくだけで 走る。さいごに ALL PASS か FAILURES が 出る。
       ・はじめに、むかしの きのうの データ（ペンの 線・かきうつしシート・★の えらびかた）を
         たんまつに 入れてから もういちど 読みこみ、かたづけと ひきつぎを 見る。
       ・この ずかんは「こたえ」を 出さない。①②③の こたえの ページ・教科書の 型の 文・
         ペンと メモが どこにも 出て こない ことも 見る。
       ===================================================================== */
    var out = [], fails = 0;
    function ok(cond, msg) {
      if (!cond) fails++;
      out.push((cond ? '<span class="ok">ok  </span>' : '<span class="ng">NG  </span>') + msg);
    }
    function flush() {
      document.getElementById('tap').innerHTML =
        (fails ? '<span class="ng">FAILURES: ' + fails + '</span>' : '<span class="ok">ALL PASS</span>') +
        '  (' + out.length + ' checks)\n\n' + out.join('\n');
    }
    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    var fr = document.getElementById('fr');
    var phase = 0;
    fr.addEventListener('load', function () {
      if (phase === 0) {
        /* 1かいめ: むかしの データを 入れて、読みこみなおす */
        phase = 1;
        var ls = fr.contentWindow.localStorage;
        ls.clear();
        ls.setItem('jz.hon.ladder', JSON.stringify({ abc: 's' }));
        ls.setItem('jz.hon.truck', JSON.stringify({ def: 't' }));
        ls.setItem('jz.sheet.truck', JSON.stringify({ x: 1 }));
        ls.setItem('jz.stars', JSON.stringify(['ladder']));
        ls.setItem('jz.filter', JSON.stringify('star'));
        /* この テストは イラスト（SVG）の 動きを たしかめる。3Dは selftest3d.html */
        ls.setItem('jz.use3d', 'false');
        fr.contentWindow.location.hash = '#/';
        fr.contentWindow.location.reload();
        return;
      }
      if (phase === 1) {
        phase = 2;
        run().catch(function (e) { ok(false, 'EXCEPTION ' + e + '\n' + (e.stack || '')); flush(); });
      }
    });

    async function go(hash) {
      fr.contentWindow.location.hash = hash;
      await wait(60);
    }

    /* おそい たんまつでは まにあわない ことが ある。「出るまで まつ」に して、時間で こけないように する。 */
    async function until(fn, ms) {
      var t0 = Date.now();
      while (Date.now() - t0 < (ms || 2000)) {
        try { if (fn()) return true; } catch (e) { }
        await wait(30);
      }
      return false;
    }

    async function run() {
      var W = fr.contentWindow, D = fr.contentDocument;
      var $ = function (s) { return D.querySelector(s); };
      var $$ = function (s) { return Array.prototype.slice.call(D.querySelectorAll(s)); };
      var cars = W.carsData, cats = W.carCategories, HON = W.honData || {};
      var KANJI = /[㐀-鿿豈-﫿々〆]/;
      var bare = function (el) {
        var c = el.cloneNode(true);
        Array.prototype.forEach.call(c.querySelectorAll('rt'), function (r) { r.remove(); });
        return c.textContent.replace(/\s+/g, ' ');
      };
      var partsOf = function (car) {
        var seen = {}, list = [];
        (W.carArt.svg(car.art, 'fit').match(/data-part="[a-zA-Z0-9_]+"/g) || []).forEach(function (m) {
          var k = m.slice(11, -1);
          if (!seen[k]) { seen[k] = true; list.push(k); }
        });
        return list;
      };

      /* ページばんごう（しょうの じゅん → その 中は cars-data.js の じゅん） */
      var book = [];
      cats.forEach(function (c) { cars.forEach(function (x) { if (x.category === c.id) book.push(x); }); });
      var pageOf = {};
      book.forEach(function (c, i) { pageOf[c.id] = i + 1; });

      /* ---- 0. むかしの データの かたづけと ひきつぎ ---- */
      var LS = W.localStorage;
      ok(LS.getItem('jz.hon.ladder') === null && LS.getItem('jz.hon.truck') === null, 'ペンの 線（jz.hon.*）は 読みこみで 消える');
      ok(LS.getItem('jz.sheet.truck') === null, 'かきうつしシート（jz.sheet.*）は 消える');
      ok(JSON.parse(LS.getItem('jz.stars') || '[]').indexOf('ladder') >= 0, '★（jz.stars）は しおりと して のこる');
      var act = $('#tabs .tab.is-active');
      ok(act && act.getAttribute('data-filter') === 'shiori', 'むかしの「★ えらんだ 車」の えらびは「しおり」に ひきつぐ');
      ok($$('#grid .card').length === 1 && !!$('#grid .card[data-id="ladder"] .card__shiori'), 'しおりの つめに はしご車 1だい');
      $('#tabs .tab[data-filter="all"]').click();

      /* ---- 1. ページの 行き先 ---- */
      await go('#/');
      ok(!$('#view-mokuji').hidden && $('#view-page').hidden && $('#view-sakuin').hidden, '#/ で もくじが 出る');
      ok($('#topbar').hidden, 'もくじでは うえの バーを 出さない');
      ok($$('#grid .card').length === cars.length, 'もくじに ' + cars.length + 'だい ならぶ');
      ok($$('#grid .chap').length === cats.length, 'しょうが ' + cats.length + 'つ');
      var badChap = [];
      cats.forEach(function (c) {
        var n = cars.filter(function (x) { return x.category === c.id; }).length;
        var got = $$('#grid .chap[data-cat="' + c.id + '"] .card').length;
        if (n !== got) badChap.push(c.id + ' ' + got + '≠' + n);
      });
      ok(badChap.length === 0, 'しょうごとに その なかまの 車が ならぶ ' + badChap.join(' / '));
      var nos = $$('#grid .card__no').map(function (e) { return Number(e.textContent); });
      ok(nos.every(function (n, i) { return n === i + 1; }), 'カードの ページばんごうが 1〜' + cars.length + ' の じゅん');
      ok($$('#grid .card').every(function (a) { return /^#\/car\/[a-z]+$/.test(a.getAttribute('href')); }), 'カードは 車の ページへ 行く');

      var tabMamoru = $('#tabs .tab[data-filter="mamoru"]');
      tabMamoru.click();
      ok($$('#grid .card').length === cars.filter(function (x) { return x.category === 'mamoru'; }).length &&
        $$('#grid .chap').length === 1, 'しょうの つめを おすと その しょうだけ 出る');
      $('#tabs .tab[data-filter="all"]').click();

      await go('#/sakuin');
      ok(!$('#view-sakuin').hidden && $('#view-mokuji').hidden && !$('#topbar').hidden, '#/sakuin で さくいん');
      var sk = $$('#view-sakuin .sakuin__a');
      ok(sk.length === cars.length, 'さくいんに ' + cars.length + 'だい');
      var badSk = [];
      sk.forEach(function (a) {
        var id = a.getAttribute('href').slice('#/car/'.length);
        var no = parseInt(a.querySelector('.sakuin__no').textContent, 10);
        if (pageOf[id] !== no) badSk.push(id + ':' + no);
      });
      ok(badSk.length === 0, 'さくいんの ページばんごうが もくじと おなじ ' + badSk.join(','));
      var heads = $$('#view-sakuin .sakuin__kana').map(function (e) { return e.textContent; });
      var GYO = 'あかさたなはまやらわ';
      ok(heads.every(function (h, i) { return i === 0 || GYO.indexOf(h) > GYO.indexOf(heads[i - 1]); }), 'さくいんの ぎょうが あいうえおの じゅん → ' + heads.join(''));

      await go('#/mikata');
      ok(!$('#view-mikata').hidden && $$('#view-mikata .mikata__list li').length === 8, '#/mikata で ずかんの 見かた（8こ）');

      await go('#/kurabe');
      ok(!$('#view-compare').hidden && $$('.crow').length === cars.length, '#/kurabe で 大きさくらべに ' + cars.length + 'だい');

      await go('#/car/does-not-exist');
      await wait(60);
      ok(W.location.hash === '#/' && !$('#view-mokuji').hidden, 'しらない 車は もくじへ');

      await go('#/hon');
      await wait(60);
      ok(W.location.hash === '#/' && !$('#view-mokuji').hidden, 'むかしの #/hon は もくじへ');
      await go('#/hon/ladder');
      await wait(60);
      ok(W.location.hash === '#/car/ladder' && !$('#view-page').hidden, 'むかしの #/hon/<id> は 車の ページへ');

      await go('#/car/truck');
      await go('#main');
      ok(!$('#view-page').hidden, '「ほんぶんへ すすむ」（#main）で ページが かわらない');

      /* ---- 2. 「こたえ」を 出さない ---- */
      ok(cars.every(function (c) { return !('shigoto' in c) && !('tsukuri' in c) && !('hakken' in c); }),
        'cars-data.js に 教科書の 型の 文（shigoto / tsukuri / hakken）が ない');
      var ANSWER = /しごとを ?して ?います|その ?ために|② ?しごと|③ ?つくり|① ?とい|こたえを 見る/;

      /* ---- 3. ぜんぶの 車の ページ ---- */
      var badPage = [], badChip = [], badAns = [], badRead = [], badTurn = [], badPhoto = [];
      for (var i = 0; i < cars.length; i++) {
        var car = cars[i], d = HON[car.id];
        await go('#/car/' + car.id);
        if ($('#view-page').hidden || !$('#view-page .page')) { badPage.push(car.id + ':ひらかない'); continue; }
        var pg = $('#view-page .page');
        if (pg.getAttribute('data-cat') !== car.category) badPage.push(car.id + ':しょうの 色');
        if (parseInt($('#view-page .page__no').textContent, 10) !== pageOf[car.id]) badPage.push(car.id + ':ページばんごう');
        if ($$('#view-page .sec').length !== d.pages.length) badPage.push(car.id + ':見出しの かず');
        if ($$('#view-page .kazu__row').length !== d.kazu.length) badPage.push(car.id + ':かずで 見る');
        if (!$('#view-page .kazu__size svg')) badPage.push(car.id + ':1年生と くらべる え');
        var otona = $('#view-page details.otona');
        if (!otona || otona.open || $$('#view-page details.otona li a').length !== d.src.length) badPage.push(car.id + ':おとなの かたへ');
        if (!$('#view-page a[href="#/kansatsu/' + car.id + '"]')) badPage.push(car.id + ':くわしく 見る');
        /* ほんぶんの 文が ぜんぶ 出て いる */
        var text = bare(pg);
        d.pages.forEach(function (p) {
          p.s.forEach(function (s) {
            var t = s.t.replace(/<rt>[\s\S]*?<\/rt>/g, '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ');
            if (text.indexOf(t) < 0) badPage.push(car.id + ':文が ない「' + t.slice(0, 12) + '」');
          });
        });

        /* こたえ・ペン・メモ が ない */
        if (ANSWER.test(text)) badAns.push(car.id + ':「' + text.match(ANSWER)[0] + '」');
        if ($('#view-page .js-pen, #view-page .penbar, #hon-memo, #view-page .memo__frame, #btn-next, #view-page .step'))
          badAns.push(car.id + ':ペン・メモ・①②③の のこり');
        $$('#view-page button, #view-page h3').forEach(function (el) {
          var t = bare(el).trim();
          if (t === 'しごと' || t === 'つくり') badAns.push(car.id + ':ラベル「' + t + '」');
        });

        /* 写真と 出典 */
        if (car.photo) {
          var img = $('#view-page .photo img');
          if (!img || img.getAttribute('src') !== car.photo) badPhoto.push(car.id + ':写真');
          if (!$('#view-page .photo .photo-credit a[href^="https://commons.wikimedia.org/"]')) badPhoto.push(car.id + ':写真の 下の 出典');
          if (!/Wikimedia Commons/.test(otona ? otona.textContent : '')) badPhoto.push(car.id + ':おとなの かたへに 出典');
        } else {
          if ($('#view-page .photo') || !pg.classList.contains('page--nophoto') || $('#view-page .photo-credit')) badPhoto.push(car.id + ':写真なし');
        }

        /* ページを めくる */
        var prev = book[pageOf[car.id] - 2], next = book[pageOf[car.id]];
        var pa = $('#view-page .turn__a--prev'), na = $('#view-page .turn__a--next');
        if (prev ? !(pa && pa.getAttribute('href') === '#/car/' + prev.id) : !!pa) badTurn.push(car.id + ':まえ');
        if (next ? !(na && na.getAttribute('href') === '#/car/' + next.id) : !!na) badTurn.push(car.id + ':つぎ');

        /* ぶぶんの 名まえ: えに ある ぶぶん ぜんぶ。おすと 光って ふきだし */
        var want = partsOf(car), chips = $$('#view-page .js-part');
        if (chips.length !== want.length) badChip.push(car.id + ':ボタン ' + chips.length + '≠' + want.length);
        for (var q = 0; q < chips.length; q++) {
          var part = chips[q].getAttribute('data-part');
          chips[q].click();
          if (!$$('#page-stage svg .is-lit').length) badChip.push(car.id + '/' + part + ':光らない');
          var co = $('#page-callout'), stg = $('#page-stage');
          if (co.hidden) badChip.push(car.id + '/' + part + ':ふきだし');
          else if (co.offsetLeft < 0 || co.offsetLeft > stg.clientWidth || co.offsetTop < 0 || co.offsetTop > stg.clientHeight)
            badChip.push(car.id + '/' + part + ':ふきだしが えの そと');
          if (chips[q].getAttribute('aria-pressed') !== 'true') badChip.push(car.id + '/' + part + ':aria-pressed');
          chips[q].click();
          if ($$('#page-stage svg .is-lit').length) badChip.push(car.id + '/' + part + ':もう一度 おしても きえない');
        }

        /* 読み上げは ルビの よみ（漢字が のこらない） */
        $$('#view-page .sec').forEach(function (sec) {
          var box = D.createElement('div');
          box.appendChild(sec.querySelector('.js-h').cloneNode(true));
          box.appendChild(sec.querySelector('.js-p').cloneNode(true));
          var r = W.jzSpeech.reading(box);
          if (KANJI.test(r)) badRead.push(car.id + ':「' + r.match(KANJI)[0] + '」');
        });
      }
      ok(badPage.length === 0, cars.length + 'だい ぜんぶ ページが 出る ' + badPage.slice(0, 8).join(' / '));
      ok(badAns.length === 0, 'どの ページにも こたえ・型・ペン・メモ・しごと/つくりの ラベルが ない ' + badAns.slice(0, 8).join(' / '));
      ok(badPhoto.length === 0, '写真と 出典の 出かた ' + badPhoto.slice(0, 8).join(' / '));
      ok(badTurn.length === 0, 'まえ・つぎの ページへ めくれる ' + badTurn.slice(0, 8).join(' / '));
      ok(badChip.length === 0, 'ぶぶんの 名まえを おすと えの その ぶぶんが 光る ' + badChip.slice(0, 8).join(' / '));
      ok(badRead.length === 0, '読み上げに 漢字が のこらない ' + badRead.slice(0, 8).join(' / '));

      /* 写真の 車でも、ぶぶんの 名まえは えで 光る（写真は そのまま） */
      await go('#/car/truck');
      $$('#view-page .js-part')[0].click();
      ok(!!$('#view-page .photo img') && $$('#page-stage svg .is-lit').length > 0, '写真は のこした まま、えの ほうが 光る');
      D.dispatchEvent(new W.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      ok($$('#page-stage svg .is-lit').length === 0, 'Esc で 光りが きえる');

      /* ---- 4. しおり ---- */
      W.localStorage.setItem('jz.stars', '[]');
      await go('#/car/truck');
      var bs = $('#btn-shiori');
      ok(!bs.hidden && bs.getAttribute('aria-pressed') === 'false', '車の ページに しおりの ボタン');
      bs.click();
      ok(bs.getAttribute('aria-pressed') === 'true' && /はさんだ/.test(bs.textContent), 'おすと しおりを はさむ');
      ok(JSON.parse(W.localStorage.getItem('jz.stars')).indexOf('truck') >= 0, 'しおりは ほぞんされる');
      $('#btn-back').click();
      await wait(80);
      ok(W.location.hash === '#/' && !$('#view-mokuji').hidden, '「← もくじ」で もくじに もどる');
      ok(!!$('#grid .card[data-id="truck"].is-last'), 'さっき 見た 車に わくが つく');
      ok(!!$('#grid .card[data-id="truck"] .card__shiori'), 'もくじの カードに しおりの しるし');
      $('#tabs .tab[data-filter="shiori"]').click();
      ok($$('#grid .card').length === 1 && $('#empty').hidden, 'しおりの つめに 1だい');
      await go('#/car/truck');
      $('#btn-shiori').click();
      await go('#/');
      ok($$('#grid .card').length === 0 && !$('#empty').hidden, 'しおりを ぬくと からっぽの おしらせ');
      $('#tabs .tab[data-filter="all"]').click();
      await go('#/sakuin');
      ok($('#btn-shiori').hidden, 'さくいんでは しおりの ボタンを 出さない');

      /* ---- 5. 写真の でどころ（ライセンスの 条件） ---- */
      ok(cars.every(function (c) { return 'photo' in c; }), 'ぜんぶの 車に photo 欄が ある');
      var PC = W.photoCredits || {}, badPC = [], LIC = /^(CC0|Public domain|CC BY(-SA)? \d(\.\d)?)$/;
      cars.forEach(function (c) {
        var p = PC[c.id];
        if (!c.photo) { if (p) badPC.push(c.id + ':写真が ないのに でどころが ある'); return; }
        if (!p) { badPC.push(c.id + ':でどころが ない'); return; }
        if (p.file !== c.photo) badPC.push(c.id + ':file と photo が ちがう');
        if (!LIC.test(p.license)) badPC.push(c.id + ':ライセンス ' + p.license);
        if (!/^https:\/\/commons\.wikimedia\.org\/wiki\/File:/.test(p.source)) badPC.push(c.id + ':source');
        if (!p.author || !p.title || !p.changes) badPC.push(c.id + ':撮影者・題・変更');
        if (/CC BY/.test(p.license) && !/^https:\/\/creativecommons\.org\//.test(p.licenseUrl)) badPC.push(c.id + ':licenseUrl');
      });
      Object.keys(PC).forEach(function (id) { if (!cars.some(function (c) { return c.id === id; })) badPC.push(id + ':しらない 車'); });
      ok(badPC.length === 0, '写真 ' + Object.keys(PC).length + 'まいに でどころが そろう ' + (badPC.join(' / ') || ''));
      ok(!(cars.filter(function (c) { return c.id === 'blood'; })[0] || {}).photo, 'けんけつ車は 写真に しない（赤十字の 標章）');

      var badImg = [];
      await Promise.all(cars.filter(function (c) { return c.photo; }).map(function (c) {
        return new Promise(function (res) {
          var im = new Image();
          im.onload = function () {
            if (!im.naturalWidth || Math.max(im.naturalWidth, im.naturalHeight) > 640) badImg.push(c.id + ':' + im.naturalWidth + 'x' + im.naturalHeight);
            res();
          };
          im.onerror = function () { badImg.push(c.id + ':よめない'); res(); };
          im.src = c.photo;
        });
      }));
      ok(badImg.length === 0, '写真が よめて、長辺 640px いか ' + (badImg.join(' / ') || ''));

      /* ---- 6. くわしく 見る ---- */

      /* 6-1. ぶひん辞書（parts-data.js）が 絵の data-part を すべて カバーするか */
      var artKeys = {}, dict = W.partInfo || {};
      W.carArt.ids().forEach(function (id) {
        (W.carArt.svg(id, 'fit').match(/data-part="[a-zA-Z0-9_]+"/g) || []).forEach(function (m) {
          artKeys[m.slice(11, -1)] = true;
        });
      });
      var noInfo = Object.keys(artKeys).filter(function (k) { return !dict[k]; });
      var noUse = Object.keys(dict).filter(function (k) { return !artKeys[k]; });
      ok(noInfo.length === 0, 'ぶひん辞書が 絵の ぶぶんを ぜんぶ カバーする ' + (noInfo.join(',') || ''));
      ok(noUse.length === 0, '辞書に つかわない ぶぶんが ない ' + (noUse.join(',') || ''));

      var noRuby = [];
      Object.keys(dict).forEach(function (k) {
        ['name', 'text'].forEach(function (f) {
          var s = String(dict[k][f] || '').replace(/<ruby>[\s\S]*?<\/ruby>/g, '');
          if (KANJI.test(s)) noRuby.push(k + '.' + f);
        });
      });
      ok(noRuby.length === 0, 'ぶひん辞書の 漢字に ふりがなが ついて いる ' + (noRuby.join(',') || ''));

      /* 6-2. ぜんぶの 車で ◯マークが 出て、絵の 上に のって いるか */
      var badMark = [], badBox = [];
      for (var n = 0; n < cars.length; n++) {
        var c7 = cars[n];
        await go('#/kansatsu/' + c7.id);
        await until(function () { return $$('.kz-mark').length > 0; }, 2500);
        await wait(60);
        var kinds = {};
        $$('#kz-stage svg [data-part]').forEach(function (e) { kinds[e.getAttribute('data-part')] = true; });
        var marks = $$('.kz-mark');
        if (marks.length !== Object.keys(kinds).length) badMark.push(c7.id + ':' + marks.length + '≠' + Object.keys(kinds).length);
        var st = $('#kz-stage').getBoundingClientRect();
        marks.forEach(function (m) {
          var r = m.getBoundingClientRect();
          if (r.left < st.left - 4 || r.right > st.right + 4 || r.top < st.top - 4 || r.bottom > st.bottom + 4) {
            badBox.push(c7.id + '/' + m.textContent);
          }
        });
        if ($$('.kz-chip').length !== marks.length) { badMark.push(c7.id + ':リストの 数が ちがう'); }
      }
      ok(badMark.length === 0, cars.length + 'だい ぜんぶ ◯マークが そろう ' + (badMark.join(' / ') || ''));
      ok(badBox.length === 0, '◯マークが がめんの 中に おさまる ' + (badBox.join(' / ') || ''));

      /* 6-3. ◯マークを おすと 光って、せつめいが 出て、✓が つく。こたえ（③ つくり）は 出さない */
      W.localStorage.removeItem('jz.kz.crane');
      await go('#/kansatsu/crane');
      await until(function () { return $$('.kz-mark').length > 0; }, 2500);
      await wait(60);
      ok(/0こ/.test($('#kz-count').textContent), 'はじめは 見た ぶぶん 0こ');
      $$('.kz-mark')[0].click();
      await wait(80);
      ok($$('#kz-stage svg .is-lit').length > 0, '◯を おすと 絵の ぶぶんが 光る');
      ok(!!$('#kz-panel') && $('#kz-panel .kz__panel-name').textContent.length > 0, 'ぶぶんの 名まえの パネルが 出る');
      ok(!$('#kz-panel .kz__tsukuri') && !/③|その ?ために/.test($('#kz-panel').textContent), 'パネルに こたえ（③ つくり）を 出さない');
      ok(/1こ/.test($('#kz-count').textContent), '見た ぶぶんが 1こに なる');
      ok(/is-found/.test($$('.kz-chip')[0].className), 'リストに ✓が つく');
      $('#kz-next').click();
      await wait(80);
      ok($('#kz-panel .kz__panel-n').textContent === '2' && /2こ/.test($('#kz-count').textContent), 'つぎの ぶぶんへ すすめる');
      $('#kz-pclose').click();
      await wait(30);
      ok(!$('#kz-panel') && $$('#kz-stage svg .is-lit').length === 0, 'とじると パネルも 光りも きえる');

      /* 6-4. ✓は ほぞんされ、車の ページに もどれる */
      await go('#/');
      await go('#/kansatsu/crane');
      await until(function () { return $$('.kz-mark').length > 0; }, 2500);
      await wait(60);
      ok(/2こ/.test($('#kz-count').textContent), '見た ✓が ほぞんされる');
      $('#kz-back').click();
      await wait(80);
      ok(!$('#view-page').hidden && $('#view-kansatsu').hidden && W.location.hash === '#/car/crane', '車の ページに もどれる');
      ok(!D.body.classList.contains('kz-open'), 'もどると ページを スクロール できる');

      /* 6-5. 3D ⇄ え の きりかえ（WebGL が つかえる ときだけ） */
      await go('#/kansatsu/ladder');
      var got3d = await until(function () { return W.jz3d && !$('#kz-mode').hidden; }, 6000);
      if (got3d) {
        ok(/3D/.test($('#kz-mode').textContent), 'えの ときは「3Dで 見る」が 出る');
        $('#kz-mode').click();
        var is3d = await until(function () { return !!$('.kz--3d'); }, 3000);
        if (is3d) {
          ok(/え/.test($('#kz-mode').textContent) && W.localStorage.getItem('jz.use3d') === 'true', '3Dに なり「えで 見る」が 出る');
          $('#kz-mode').click();
          await until(function () { return !$('.kz--3d') && $$('.kz-mark').length > 0; }, 3000);
          ok(!$('.kz--3d') && W.localStorage.getItem('jz.use3d') === 'false', 'えに もどせる');
        } else {
          ok(true, '（WebGL が つかえないので 3Dの きりかえは 見ない）');
        }
      } else {
        ok(true, '（3Dが 読みこめないので 3Dの きりかえは 見ない）');
      }
      await go('#/');

      /* ---- 7. 車の ページの 中身（hon-data.js）。tools/check-hon.mjs と おなじ ことを ブラウザでも 見る ---- */
      var noHon = [], badHon = [];
      cars.forEach(function (c) {
        var d = HON[c.id];
        if (!d) { noHon.push(c.id); return; }
        var parts = {};
        partsOf(c).forEach(function (k) { parts[k] = true; });
        var cnt = { s: 0, t: 0, o: 0 }, used = {}, texts = [d.catch];
        d.pages.forEach(function (pg) {
          texts.push(pg.h);
          pg.s.forEach(function (s) {
            cnt[s.k] = (cnt[s.k] || 0) + 1;
            texts.push(s.t);
            if (s.part) {
              if (!parts[s.part]) { badHon.push(c.id + ':絵に ない part ' + s.part); }
              used[s.part] = true;
            }
            var pl = s.t.replace(/<rt>[\s\S]*?<\/rt>/g, '').replace(/<[^>]+>/g, '');
            if (/その ?ために|しごとを ?して ?います/.test(pl)) { badHon.push(c.id + ':教科書の 型 「' + pl + '」'); }
          });
        });
        (d.kazu || []).forEach(function (k) { texts.push(k.l, k.v); });
        var total = cnt.s + cnt.t + cnt.o;
        if (cnt.s < 2 || cnt.t < 5 || cnt.o < 1 || total < 11 || total > 18) {
          badHon.push(c.id + ':文の かず s' + cnt.s + ' t' + cnt.t + ' o' + cnt.o);
        }
        if (Object.keys(used).length < 2) { badHon.push(c.id + ':本文に 出て くる ぶぶんが 2しゅるい より すくない'); }
        texts.forEach(function (t) {
          if (KANJI.test(String(t).replace(/<ruby>[\s\S]*?<\/ruby>/g, ''))) { badHon.push(c.id + ':ルビの ない 漢字 「' + t + '」'); }
        });
        if (!d.src || d.src.length < 2 || !d.src.every(function (s) { return /^https:\/\//.test(s.u); })) {
          badHon.push(c.id + ':しらべた ところ（src）');
        }
      });
      ok(noHon.length === 0, cars.length + 'だい ぜんぶに ページの 中身が ある ' + (noHon.join(',') || ''));
      ok(badHon.length === 0, 'ページの 中身が きまりを まもって いる ' + (badHon.slice(0, 8).join(' / ') || ''));

      W.localStorage.removeItem('jz.stars');
      W.localStorage.removeItem('jz.filter');
      flush();
      document.title = fails ? 'FAIL' : 'PASS';
    }
  </script>
</body>

</html>
