<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>selftest</title>
  <style>
    #tap {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #fff;
      font: 13px/1.5 monospace;
      padding: 10px;
      overflow: auto;
      white-space: pre-wrap;
    }

    .ok {
      color: #157a3b;
    }

    .ng {
      color: #c0242c;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="tap">running…</div>
  <iframe id="fr" src="index.html" style="width:1100px;height:900px;border:0"></iframe>

  <script>
    var out = [], fails = 0;
    function ok(cond, msg) {
      if (!cond) fails++;
      out.push((cond ? '<span class="ok">ok  </span>' : '<span class="ng">NG  </span>') + msg);
    }
    function flush() {
      document.getElementById('tap').innerHTML =
        (fails ? '<span class="ng">FAILURES: ' + fails + '</span>' : '<span class="ok">ALL PASS</span>') +
        '  (' + out.length + ' checks)\n\n' + out.join('\n');
    }
    function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    var fr = document.getElementById('fr');
    fr.addEventListener('load', function () { run().catch(function (e) { ok(false, 'EXCEPTION ' + e); flush(); }); });

    async function go(hash) {
      fr.contentWindow.location.hash = hash;
      await wait(60);
    }

    /* おそい たんまつでは 150ms では まにあわない ことが ある。
       「出るまで まつ」に して、時間で こけないように する。 */
    async function until(fn, ms) {
      var t0 = Date.now();
      while (Date.now() - t0 < (ms || 2000)) {
        try { if (fn()) return true; } catch (e) { }
        await wait(30);
      }
      return false;
    }

    async function run() {
      var W = fr.contentWindow, D = fr.contentDocument;
      var $ = function (s) { return D.querySelector(s); };
      var $$ = function (s) { return Array.prototype.slice.call(D.querySelectorAll(s)); };
      var cars = W.carsData;

      W.localStorage.clear();
      /* このテストは イラスト（SVG）の 動きを たしかめる もの。
         3Dの 動きは selftest3d.html が べつに たしかめます。 */
      W.localStorage.setItem('jz.use3d', 'false');

      /* ---- 1. ルーティング ---- */
      await go('#/');
      ok(!$('#view-list').hidden, 'ルート #/ で 一覧が 出る');
      ok($('#view-detail').hidden && $('#view-compare').hidden, '一覧のとき 他の 画面は 出ない');
      ok($('#topbar').hidden, '一覧では もどるバーを 出さない');
      ok($$('#grid .card').length === cars.length, '一覧に ' + cars.length + 'だい ならぶ');

      await go('#/kurabe');
      ok(!$('#view-compare').hidden && $('#view-list').hidden, '#/kurabe で 大きさくらべ');
      ok($$('.crow').length === cars.length, '大きさくらべに ' + cars.length + 'だい ならぶ');

      await go('#/car/does-not-exist');
      ok(!$('#view-list').hidden, 'しらない id は 一覧に もどす');

      /* ---- 2. ぜんぶの 車：じゅんばん展開と 部位ハイライト ---- */
      var badStep = [], badLit = [], badLabel = [];
      for (var i = 0; i < cars.length; i++) {
        var car = cars[i];
        await go('#/car/' + car.id);

        if ($('#step-job').hidden !== true) badStep.push(car.id + ':しごとが 最初から 見えている');
        var makes = $$('.js-make');
        if (makes.length !== car.tsukuri.length) badStep.push(car.id + ':つくりの 数');
        if (!makes.every(function (m) { return m.hidden; })) badStep.push(car.id + ':つくりが 最初から 見えている');

        $('#btn-next').click();
        if ($('#step-job').hidden) badStep.push(car.id + ':しごとが ひらかない');
        if (!$$('.js-make').every(function (m) { return m.hidden; })) badStep.push(car.id + ':つくりが 早く 出る');

        for (var k = 0; k < car.tsukuri.length; k++) {
          $('#btn-next').click();
          if ($$('.js-make')[k].hidden) badStep.push(car.id + ':つくり' + (k + 1) + 'が ひらかない');
        }
        if (!$('#btn-next').hidden) badStep.push(car.id + ':さいごで ボタンが のこる');

        /* 部位ハイライト */
        for (var k2 = 0; k2 < car.tsukuri.length; k2++) {
          var m2 = $$('.js-make')[k2];
          m2.click();
          var lit = $$('#art-stage svg .is-lit');
          if (!lit.length) badLit.push(car.id + '/' + car.tsukuri[k2].part);
          if ($('#callout').hidden) badLabel.push(car.id + '/' + car.tsukuri[k2].part + ':ふきだし 出ない');
          var L = $('#callout').offsetLeft, T = $('#callout').offsetTop;
          var W2 = $('#art-stage').clientWidth, H2 = $('#art-stage').clientHeight;
          if (L < 0 || L > W2 || T < 0 || T > H2) {
            badLabel.push(car.id + ':ふきだしが 絵の そとに 出た (' + Math.round(L) + ',' + Math.round(T) + ')');
          }
          m2.click();
          if ($$('#art-stage svg .is-lit').length) badLit.push(car.id + ':もう一度 おしても きえない');
        }
      }
      ok(badStep.length === 0, 'じゅんばんに しか ひらかない ' + (badStep.join(' / ') || ''));
      ok(badLit.length === 0, cars.length + 'だい ぜんぶ 絵の ぶぶんが 光る ' + (badLit.join(' / ') || ''));
      ok(badLabel.length === 0, 'ふきだしが 絵の 中に 出る ' + (badLabel.join(' / ') || ''));

      /* ---- 3. えらんだ 車（★） ---- */
      await go('#/car/truck');
      $('#btn-star').click();
      ok($('#btn-star').getAttribute('aria-pressed') === 'true', '★を おすと えらんだ じょうたいに なる');
      await go('#/');
      var starTab = $$('#tabs .tab').filter(function (t) { return t.getAttribute('data-filter') === 'star'; })[0];
      starTab.click();
      ok($$('#grid .card').length === 1, '★タブに えらんだ 1だいだけ 出る');
      ok($('#empty').hidden, '1だい あるので からっぽの おしらせは 出さない');
      $('#grid .js-star').click();
      ok($$('#grid .card').length === 0 && !$('#empty').hidden, '★を はずすと からっぽの おしらせが 出る');
      var allTab = $$('#tabs .tab').filter(function (t) { return t.getAttribute('data-filter') === 'all'; })[0];
      allTab.click();

      /* ---- 4. 読み上げテキスト（ルビの よみに なるか） ---- */
      await go('#/car/crane');
      var p = $('.step--q .js-read');
      var clone = p.cloneNode(true);
      Array.prototype.forEach.call(clone.querySelectorAll('ruby'), function (r) {
        var rt = r.querySelector('rt');
        if (rt) r.parentNode.replaceChild(D.createTextNode(rt.textContent.trim()), r);
      });
      var read = clone.textContent.replace(/\s+/g, ' ').trim();
      ok(read.indexOf('クレーンしゃは') === 0, '読み上げが「クレーンしゃ」に なる → ' + read.slice(0, 24));
      ok(!/[一-鿿]/.test(read), '読み上げテキストに 漢字が のこらない');

      /* ---- 5. 写真さしかえの しくみ ---- */
      ok(W.carsData.every(function (c) { return 'photo' in c; }), 'ぜんぶの 車に photo 欄が ある');

      /* 5-2. 写真には かならず でどころ（ライセンスの 条件） */
      var PC = W.photoCredits || {}, badPC = [], LIC = /^(CC0|Public domain|CC BY(-SA)? \d(\.\d)?)$/;
      cars.forEach(function (c) {
        var p = PC[c.id];
        if (!c.photo) { if (p) badPC.push(c.id + ':写真が ないのに でどころが ある'); return; }
        if (!p) { badPC.push(c.id + ':でどころが ない'); return; }
        if (p.file !== c.photo) badPC.push(c.id + ':file と photo が ちがう');
        if (!LIC.test(p.license)) badPC.push(c.id + ':ライセンス ' + p.license);
        if (!/^https:\/\/commons\.wikimedia\.org\/wiki\/File:/.test(p.source)) badPC.push(c.id + ':source');
        if (!p.author || !p.title || !p.changes) badPC.push(c.id + ':撮影者・題・変更');
        if (/CC BY/.test(p.license) && !/^https:\/\/creativecommons\.org\//.test(p.licenseUrl)) badPC.push(c.id + ':licenseUrl');
      });
      Object.keys(PC).forEach(function (id) { if (!cars.some(function (c) { return c.id === id; })) badPC.push(id + ':しらない 車'); });
      ok(badPC.length === 0, '写真 ' + Object.keys(PC).length + 'まいに でどころが そろう ' + (badPC.join(' / ') || ''));
      ok(!(cars.filter(function (c) { return c.id === 'blood'; })[0] || {}).photo, 'けんけつ車は 写真に しない（赤十字の 標章）');

      var badImg = [];
      await Promise.all(cars.filter(function (c) { return c.photo; }).map(function (c) {
        return new Promise(function (res) {
          var im = new Image();
          im.onload = function () {
            if (!im.naturalWidth || Math.max(im.naturalWidth, im.naturalHeight) > 640) badImg.push(c.id + ':' + im.naturalWidth + 'x' + im.naturalHeight);
            res();
          };
          im.onerror = function () { badImg.push(c.id + ':よめない'); res(); };
          im.src = c.photo;
        });
      }));
      ok(badImg.length === 0, '写真が よめて、長辺 640px いか ' + (badImg.join(' / ') || ''));

      var pcar = cars.filter(function (c) { return c.photo; })[0];
      if (pcar) {
        await go('#/car/' + pcar.id);
        ok(!!$('#view-detail .photo-credit a[href^="https://commons.wikimedia.org/"]'), '①②③の ページの 写真の 下に でどころが 出る');
        await go('#/hon/' + pcar.id);
        ok(!!$('#view-hon .photo-credit a[href^="https://commons.wikimedia.org/"]'), '本の ページの 写真の 下に でどころが 出る');
      }
      var icar = cars.filter(function (c) { return !c.photo; })[0];
      if (icar) {
        await go('#/car/' + icar.id);
        ok(!$('#view-detail .photo-credit'), 'イラストの 車には でどころを 出さない');
      }

      /* ---- 6. ものすごい かんさつ ---- */

      /* 6-1. ぶひん辞書（parts-data.js）が 絵の data-part を すべて カバーするか */
      var artKeys = {}, dict = W.partInfo || {};
      W.carArt.ids().forEach(function (id) {
        (W.carArt.svg(id, 'fit').match(/data-part="[a-zA-Z0-9_]+"/g) || []).forEach(function (m) {
          artKeys[m.slice(11, -1)] = true;
        });
      });
      var noInfo = Object.keys(artKeys).filter(function (k) { return !dict[k]; });
      var noUse = Object.keys(dict).filter(function (k) { return !artKeys[k]; });
      ok(noInfo.length === 0, 'ぶひん辞書が 絵の ぶぶんを ぜんぶ カバーする ' + (noInfo.join(',') || ''));
      ok(noUse.length === 0, '辞書に つかわない ぶぶんが ない ' + (noUse.join(',') || ''));

      var noRuby = [];
      Object.keys(dict).forEach(function (k) {
        ['name', 'text'].forEach(function (f) {
          var s = String(dict[k][f] || '').replace(/<ruby>[\s\S]*?<\/ruby>/g, '');
          if (/[一-鿿]/.test(s)) noRuby.push(k + '.' + f);
        });
      });
      ok(noRuby.length === 0, 'ぶひん辞書の 漢字に ふりがなが ついて いる ' + (noRuby.join(',') || ''));

      /* 6-2. ぜんぶの 車で ◯マークが 出て、絵の 上に のって いるか */
      var badMark = [], badBox = [];
      for (var n = 0; n < cars.length; n++) {
        var c7 = cars[n];
        await go('#/kansatsu/' + c7.id);
        await until(function () { return $$('.kz-mark').length > 0; }, 2500);
        await wait(60);
        var kinds = {};
        $$('#kz-stage svg [data-part]').forEach(function (e) { kinds[e.getAttribute('data-part')] = true; });
        var want = Object.keys(kinds).length;
        var marks = $$('.kz-mark');
        if (marks.length !== want) {
          badMark.push(c7.id + ':' + marks.length + '≠' + want);
        }
        if (marks.length < c7.tsukuri.length) { badMark.push(c7.id + ':つくりの ぶぶんが たりない'); }
        var st = $('#kz-stage').getBoundingClientRect();
        marks.forEach(function (m) {
          var r = m.getBoundingClientRect();
          if (r.left < st.left - 4 || r.right > st.right + 4 ||
            r.top < st.top - 4 || r.bottom > st.bottom + 4) {
            badBox.push(c7.id + '/' + m.textContent);
          }
        });
        if ($$('.kz-chip').length !== marks.length) { badMark.push(c7.id + ':リストの 数が ちがう'); }
      }
      ok(badMark.length === 0, cars.length + 'だい ぜんぶ ◯マークが そろう ' + (badMark.join(' / ') || ''));
      ok(badBox.length === 0, '◯マークが がめんの 中に おさまる ' + (badBox.join(' / ') || ''));

      /* 6-3. ◯マークを おすと 光って、せつめいが 出て、✓が つく */
      W.localStorage.removeItem('jz.kz.crane');
      await go('#/kansatsu/crane');
      await until(function () { return $$('.kz-mark').length > 0; }, 2500);
      await wait(60);
      ok(/0こ/.test($('#kz-count').textContent), 'はじめは 見た ぶぶん 0こ');
      $$('.kz-mark')[0].click();
      await wait(80);
      ok($$('#kz-stage svg .is-lit').length > 0, '◯を おすと 絵の ぶぶんが 光る');
      ok(!!$('#kz-panel'), 'せつめいの パネルが 出る');
      ok($('#kz-panel .kz__panel-name').textContent.length > 0, 'ぶぶんの 名まえが 出る');
      ok(/1こ/.test($('#kz-count').textContent), '見た ぶぶんが 1こに なる');
      ok(/kz-chip is-found|is-found/.test($$('.kz-chip')[0].className), 'リストに ✓が つく');

      $('#kz-next').click();
      await wait(80);
      ok($('#kz-panel .kz__panel-n').textContent === '2', 'つぎの ぶぶんへ すすめる');
      ok(/2こ/.test($('#kz-count').textContent), '見た ぶぶんが 2こに なる');

      $('#kz-pclose').click();
      await wait(30);
      ok(!$('#kz-panel'), 'とじると パネルが きえる');
      ok($$('#kz-stage svg .is-lit').length === 0, 'とじると 光りも きえる');

      /* 6-4. ✓は ほぞんされ、ずかんに もどれる */
      await go('#/');
      await go('#/kansatsu/crane');
      await until(function () { return $$('.kz-mark').length > 0; }, 2500);
      await wait(60);
      ok(/2こ/.test($('#kz-count').textContent), '見た ✓が ほぞんされる');
      $('#kz-back').click();
      await wait(80);
      ok(!$('#view-detail').hidden && $('#view-kansatsu').hidden, 'ずかんの ページに もどれる');
      ok(!D.body.classList.contains('kz-open'), 'もどると ページを スクロール できる');
      ok(!!$('.btn--zoom'), '詳細ページに かんさつへの ボタンが ある');

      /* ---- 7. じどう車の 本（#/hon） ---- */
      var HON = W.honData || {};
      var KANJI = /[㐀-鿿豈-﫿々〆]/;

      /* 7-1. 中身の きまり（tools/check-hon.mjs と おなじ ことを ブラウザでも 見る） */
      var noHon = [], badHon = [];
      cars.forEach(function (c) {
        var d = HON[c.id];
        if (!d) { noHon.push(c.id); return; }
        var parts = {};
        (W.carArt.svg(c.art, 'fit').match(/data-part="[a-zA-Z0-9_]+"/g) || []).forEach(function (m) {
          parts[m.slice(11, -1)] = true;
        });
        var cnt = { s: 0, t: 0, o: 0 }, used = {}, texts = [d.catch];
        d.pages.forEach(function (pg) {
          texts.push(pg.h);
          pg.s.forEach(function (s) {
            cnt[s.k] = (cnt[s.k] || 0) + 1;
            texts.push(s.t);
            if (s.part) {
              if (!parts[s.part]) { badHon.push(c.id + ':絵に ない part ' + s.part); }
              used[s.part] = true;
            }
            var pl = s.t.replace(/<rt>[\s\S]*?<\/rt>/g, '').replace(/<[^>]+>/g, '');
            if (/その ?ために|しごとを ?して ?います/.test(pl)) { badHon.push(c.id + ':教科書の 型 「' + pl + '」'); }
          });
        });
        (d.kazu || []).forEach(function (k) { texts.push(k.l, k.v); });
        var total = cnt.s + cnt.t + cnt.o;
        if (cnt.s < 2 || cnt.t < 5 || cnt.o < 1 || total < 11 || total > 18) {
          badHon.push(c.id + ':文の かず s' + cnt.s + ' t' + cnt.t + ' o' + cnt.o);
        }
        if (Object.keys(used).length < 2) { badHon.push(c.id + ':「ここを 見て」が 2つ より すくない'); }
        texts.forEach(function (t) {
          if (KANJI.test(String(t).replace(/<ruby>[\s\S]*?<\/ruby>/g, ''))) { badHon.push(c.id + ':ルビの ない 漢字 「' + t + '」'); }
        });
        if (!d.src || d.src.length < 2 || !d.src.every(function (s) { return /^https:\/\//.test(s.u); })) {
          badHon.push(c.id + ':しらべた ところ（src）');
        }
      });
      ok(noHon.length === 0, cars.length + 'だい ぜんぶに 本の ページが ある ' + (noHon.join(',') || ''));
      ok(badHon.length === 0, '本の 中身が きまりを まもって いる ' + (badHon.slice(0, 8).join(' / ') || ''));

      /* 7-2. 本の もくじ */
      await go('#/hon');
      ok(!$('#view-list').hidden && !$('#hon-header').hidden && $('#site-header').hidden,
        '#/hon で 本の もくじが 出る');
      ok($$('#grid .card').length === cars.length, '本の もくじに ' + cars.length + 'だい ならぶ');
      ok($$('#grid .card__link').every(function (a) { return a.getAttribute('href').indexOf('#/hon/') === 0; }),
        'もくじの カードは 本の ページへ 行く');
      ok(!$('#note-hon').hidden && $('#note-zukan').hidden, 'もくじでは 本の よみかたを 出す');
      await go('#/');
      ok(!!$('#list-tools a[href="#/hon"]'), 'ずかんの 一覧から 本へ 行ける');
      ok($$('#grid .card__link').every(function (a) { return a.getAttribute('href').indexOf('#/car/') === 0; }),
        'ずかんの カードは これまでどおり ①②③の ページへ 行く');

      /* 7-3. ぜんぶの 車の 本を ひらき、文の かずと「ここを 見て！」を たしかめる */
      var badPage = [], badChip = [];
      for (var h = 0; h < cars.length; h++) {
        var hc = cars[h], hd = HON[hc.id];
        if (!hd) { continue; }
        await go('#/hon/' + hc.id);
        if ($('#view-hon').hidden) { badPage.push(hc.id + ':ひらかない'); continue; }
        var nS = hd.pages.reduce(function (a, pg) { return a + pg.s.length; }, 0);
        if ($$('#view-hon .hon__p .hs').length !== nS) { badPage.push(hc.id + ':文の かず'); }
        if ($$('#view-hon .hon__kz-row').length !== hd.kazu.length) { badPage.push(hc.id + ':かずで 見る'); }
        if ($$('#view-hon .hon__sec').length !== hd.pages.length) { badPage.push(hc.id + ':見出しの かず'); }
        var chips = $$('#view-hon .js-hon-part');
        if (chips.length < 2) { badChip.push(hc.id + ':ボタンが ' + chips.length); }
        for (var q = 0; q < chips.length; q++) {
          chips[q].click();
          var part = chips[q].getAttribute('data-part');
          if (!$$('#hon-stage svg .is-lit').length) { badChip.push(hc.id + '/' + part + ':光らない'); }
          var co = $('#hon-callout'), stg = $('#hon-stage');
          if (co.hidden) { badChip.push(hc.id + '/' + part + ':ふきだし'); }
          else if (co.offsetLeft < 0 || co.offsetLeft > stg.clientWidth || co.offsetTop < 0 || co.offsetTop > stg.clientHeight) {
            badChip.push(hc.id + '/' + part + ':ふきだしが 絵の そと');
          }
          chips[q].click();
          if ($$('#hon-stage svg .is-lit').length) { badChip.push(hc.id + '/' + part + ':もう一度 おしても きえない'); }
        }
      }
      ok(badPage.length === 0, cars.length + 'だい ぜんぶ 本の ページが 出る ' + (badPage.join(' / ') || ''));
      ok(badChip.length === 0, '「ここを 見て！」で 絵の ぶぶんが 光る ' + (badChip.join(' / ') || ''));

      /* 7-4. ペンで 線を ひく → メモに あつまる */
      W.localStorage.removeItem('jz.hon.ladder');
      await go('#/hon/ladder');
      var sents = function () { return $$('#view-hon .hon__p .hs'); };
      var saved = function () { return JSON.parse(W.localStorage.getItem('jz.hon.ladder') || '{}'); };
      sents()[0].click();
      ok(!/is-[st]/.test(sents()[0].className), 'ペンを もたずに おしても 線は ひかれない');
      ok($('#hon-toast').classList.contains('is-on'), 'ペンを えらぶように おしえる');

      $('.js-pen[data-pen="s"]').click();
      ok($('.js-pen[data-pen="s"]').getAttribute('aria-pressed') === 'true', 'しごとの ペンを もてる');
      sents()[0].click();
      sents()[1].click();
      ok(sents()[0].classList.contains('is-s') && sents()[1].classList.contains('is-s'), 'しごとの ペンで 線が ひける');
      ok(Object.keys(saved()).length === 2, '線は ほぞんされる');
      sents()[1].click();
      ok(!sents()[1].classList.contains('is-s'), 'おなじ ペンで もう いちど おすと 線が きえる');

      $('.js-pen[data-pen="t"]').click();
      ok($('.js-pen[data-pen="s"]').getAttribute('aria-pressed') === 'false', 'ペンは 1本だけ もてる');
      sents()[3].click();
      sents()[4].click();
      sents()[0].click();
      ok(sents()[0].classList.contains('is-t'), 'ちがう ペンで おすと 色が かわる');
      $$('#view-hon .hon__kz-row')[0].click();
      ok($$('#view-hon .hon__kz-row')[0].classList.contains('is-t'), '「かずで 見る」にも 線が ひける');

      $('.js-pen[data-pen="x"]').click();
      sents()[4].click();
      ok(!/is-[st]/.test(sents()[4].className), 'けすで 線が きえる');
      ok(/0.*3/.test($('#hon-count').textContent), 'メモの かずが 出る（しごと0・つくり3）→ ' + $('#hon-count').textContent);

      $('.js-memo-open').click();
      ok(!$('#hon-memo').hidden, '📝 メモが ひらく');
      ok($$('#hon-memo .memo__item--s').length === 0 && $$('#hon-memo .memo__item--t').length === 3,
        'メモに つくりが 3つ あつまる');
      ok(!!$('#hon-memo .memo__group--s .memo__empty'), 'しごとが ない ときは ペンを つかうように 出る');
      ok(/しごとを して います/.test($('#hon-memo .memo__frame').textContent) &&
        /その ために/.test($('#hon-memo .memo__frame').textContent), 'ノートに かく かたちが 出る');
      $$('#hon-memo .js-memo-del')[0].click();
      ok($$('#hon-memo .memo__item--t').length === 2, 'メモから 1つ けせる');
      ok(Object.keys(saved()).length === 2, 'けした ことも ほぞんされる');
      $('#hon-memo .js-memo-clear').click();
      ok($$('#hon-memo .memo__item--t').length === 2, 'ぜんぶ けすは 1かいでは けさない');
      $('#hon-memo .js-memo-clear').click();
      ok($$('#hon-memo .memo__item').length === 0 && Object.keys(saved()).length === 0, '2かい おすと ぜんぶ けせる');
      $('#hon-memo .js-memo-close').click();
      ok($('#hon-memo').hidden, 'メモを とじられる');

      /* 7-5. もどって きても 線が のこる。もくじに メモの かずが 出る */
      $('.js-pen[data-pen="s"]').click();
      sents()[2].click();
      await go('#/hon');
      var lcard = $$('#grid .card').filter(function (c) { return c.querySelector('a[href="#/hon/ladder"]'); })[0];
      ok(!!(lcard && lcard.querySelector('.card__memo')), 'もくじの カードに メモの かずが 出る');
      await go('#/hon/ladder');
      ok(sents()[2].classList.contains('is-s'), 'もう いちど ひらいても 線が のこって いる');
      ok($$('#view-hon .js-pen').every(function (b) { return b.getAttribute('aria-pressed') === 'false'; }),
        'ひらいた ときは ペンを もって いない');

      /* 7-6. 読み上げは ルビの よみに なる */
      var hp = $('#view-hon .hon__p').cloneNode(true);
      Array.prototype.forEach.call(hp.querySelectorAll('.js-state'), function (e) { e.parentNode.removeChild(e); });
      Array.prototype.forEach.call(hp.querySelectorAll('ruby'), function (r) {
        var rt = r.querySelector('rt');
        if (rt) r.parentNode.replaceChild(D.createTextNode(rt.textContent.trim()), r);
      });
      ok(!KANJI.test(hp.textContent), '本の 読み上げテキストに 漢字が のこらない');

      /* 7-7. 行き来 */
      $('#btn-back').click();
      await wait(80);
      ok(W.location.hash === '#/hon' && !$('#view-list').hidden, '本の ページから もくじに もどる → ' + W.location.hash);
      await go('#/car/ladder');
      ok(!!$('#view-detail .btn--hon-go[href="#/hon/ladder"]'), '①②③の ページから その 車の 本へ 行ける');
      await go('#/');
      W.localStorage.removeItem('jz.hon.ladder');

      flush();
      document.title = fails ? 'FAIL' : 'PASS';
    }
  </script>
</body>

</html>
